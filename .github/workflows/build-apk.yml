name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar código
        uses: actions/checkout@v4

      - name: Extrair pasta app/ do ZIP
        run: |
          if [ ! -d app ]; then
            rm -rf /tmp/src && mkdir -p /tmp/src
            unzip -q -o guardiao-mobile-github.zip -d /tmp/src
            if [ -d /tmp/src/app ]; then
              cp -r /tmp/src/app ./app
            elif [ -d /tmp/src/guardiao-android/app ]; then
              cp -r /tmp/src/guardiao-android/app ./app
            else
              echo "::error::O ZIP não contém a pasta app/"
              exit 1
            fi
          else
            echo "Pasta app/ já existe no repositório — a usar diretamente"
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Compilar APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: guardiao-mobile-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
